# Every check on every push: the tests (device protocols, the hub's rules,
# security, the display's logic), the games, the
# display's layout, the compiles for both boards and the web pages' scripts -
# tools/check_all.py, as run on the PC. About two minutes.
name: Checks

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tools
        # mpy-cross must match the boards' MicroPython (tools/build_mpy.py)
        run: pip install "mpy-cross==1.29.0.post2" pillow cryptography

      - name: Run every check
        run: python tools/check_all.py
