<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e12">
<!-- Add to Home Screen: the Camperlux icon and name, opening full-screen -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.jpg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camperlux">
<!-- black-translucent: the status bar sits over the page, and #app's top padding
     (the safe area) keeps the page clear of it - with "black" the space was given twice -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>if(/; wv\)/.test(navigator.userAgent)) document.documentElement.classList.add("wv");</script>
<title>IntrepidVan</title>
<style>
/* The van display's look, for any screen. Colours are the display's own
   (display/gfx.py); on a wide screen the pages are laid out as on the 4"
   panel, on a phone the cards stack. */
:root{
  --bg:#0f0e12; --bgtop:#15131a; --bgbot:#0a090d; --panel:#1c1a22; --panel2:#27242e;
  --line:#34303c; --hi:#2c2934; --txt:#efe9e0; --muted:#9a8f9e; --green:#3fb950;
  --amber:#d29922; --red:#f85149; --blue:#58a6ff; --cyan:#39d3c3; --brand:#d3a94a;
  --flame:#ff9d3c; --ember:#ff6a3d; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;display:flex;flex-direction:column;
  transform-origin:0 0;
  background:linear-gradient(var(--bgtop),var(--bgbot));
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body.alerting #app{top:var(--alerth,52px);padding-top:0}
/* Inside the Android app the app itself keeps the page clear of the status and
   navigation bars, yet its WebView still reports them as safe areas: without
   this the space was given twice, a band above the header and below the tabs. */
html.wv #app{padding:0}
html.wv nav{height:60px;padding-bottom:4px}
html.wv #alertbar{padding-top:10px}
/* no hub password yet: a reminder in the header, until one is set */
#nopw{background:var(--amber);color:#15131a;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
  text-decoration:none;white-space:nowrap}   /* the banner covers the notch */
#alertbar{position:fixed;left:0;right:0;top:0;z-index:950;display:none;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  background:var(--red);color:#fff;font-size:15px;font-weight:600;box-shadow:0 2px 18px rgba(0,0,0,.5)}
#alertbar.show{display:flex}
#alertbar .atext{flex:1;min-width:0}
#alertbar .adetail{display:block;font-weight:400;font-size:13px;opacity:.92;margin-top:2px}
#alertbar button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5);
  border-radius:10px;padding:8px 12px;font-weight:600;flex:0 0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* ---- header: the page's name, its selector or buttons, status and clock -- */
header{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px}
#title{font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hbar{display:flex;gap:8px;align-items:center;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
#hbar::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;
  padding:5px 12px 5px 9px;font-size:14px;color:var(--txt);white-space:nowrap}
.chip .ic{width:16px;height:16px;color:var(--muted)}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:2px}
.seg button{padding:4px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--brand);color:#000}
#hright{margin-left:auto;display:flex;align-items:center;gap:12px;flex:0 0 auto}
#link{width:10px;height:10px;border-radius:50%;background:var(--muted)}
#link.ok{background:var(--green)} #link.stale{background:var(--amber)} #link.down{background:var(--red)}
#clock{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
#gear{display:flex;padding:4px;color:var(--muted)} #gear .ic{width:22px;height:22px}

/* ---- the pages, side by side for swiping ---- */
#pages{position:relative;flex:1 1 auto;overflow:hidden;touch-action:pan-y}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px;display:none;
  -webkit-overflow-scrolling:touch}
.page.show{display:block}
.view{display:none;height:100%} .view.show{display:block}

/* ---- the tab bar ---- */
nav{height:calc(60px + env(safe-area-inset-bottom));flex:0 0 auto;display:flex;justify-content:space-around;align-items:stretch;
  padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-top:1px solid #1d1b22}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:13px;color:var(--muted);border-radius:12px;margin:0 2px;white-space:nowrap;overflow:hidden}
nav button .ic{width:20px;height:20px}
nav button.on{color:var(--brand);background:#3a321f}

/* ---- cards and controls ---- */
.card{background:var(--panel);border-radius:var(--r);padding:12px 14px;position:relative;
  box-shadow:0 3px 0 #0006, inset 0 1px 0 var(--hi)}
.lab{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);
  border-radius:12px;min-height:44px;padding:0 12px;font-size:17px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.lit{background:var(--brand);color:#000} .btn.hot{background:var(--flame);color:#000}
.btn.danger{background:#7a2b2c} .btn.go{background:#2c6b3a}
.btn .ic{width:18px;height:18px}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:32px;height:32px;border-radius:50%;background:var(--panel2);display:flex;
  align-items:center;justify-content:center} .step button .ic{width:14px;height:14px}
.step b{min-width:58px;text-align:center;background:var(--panel2);border-radius:8px;padding:5px 6px;
  font-variant-numeric:tabular-nums}
.tog{width:52px;height:28px;border-radius:14px;background:var(--panel2);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;
  background:var(--muted);transition:.2s}
.tog.on{background:var(--brand)} .tog.on::after{left:28px;background:var(--txt)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.grid{display:grid;gap:8px;height:100%}

/* layouts per page: the display's on a wide screen, stacked on a phone */
.home{grid-template-columns:1fr 1fr} .home .right{display:grid;gap:8px;grid-template-rows:1fr auto}
.two{grid-template-columns:1fr 1fr}
.side{grid-template-columns:minmax(0,1.7fr) minmax(170px,1fr)}
.sw{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
/* Laid out as the display: rows share the height, and diagrams shrink to fit
   it - without this a wide column made the clock, the heater diagram and the
   bubble taller than the screen on a phone held sideways. */
body:not(.narrow) .home,body:not(.narrow) .two,body:not(.narrow) .side{grid-template-rows:minmax(0,1fr)}
body:not(.narrow) .grid > *{min-height:0}
body:not(.narrow) #lvmain{min-height:0 !important}
.dia,#clockface{max-width:100%;max-height:100%}
/* a phone held upright: the cards stack (body.narrow is set by fit() below) */
body.narrow .home,body.narrow .two,body.narrow .side{grid-template-columns:1fr;height:auto}
body.narrow .sw{grid-template-columns:1fr 1fr;grid-template-rows:none;height:auto}
body.narrow .grid{height:auto}
body.narrow #clock{font-size:16px}
body.narrow header{gap:8px;padding:6px 10px;height:auto;flex-wrap:wrap;row-gap:6px}
body.narrow #title{flex:1 1 0} body.narrow #hbar{order:3;width:100%} body.narrow #hbar:empty{display:none}
body.narrow nav{padding-left:2px;padding-right:2px}
body.narrow nav button{font-size:10.5px;margin:0 1px;padding:0}
/* upright phone: the weather and battery cards' contents sit in the middle */
body.narrow #wbody,body.narrow #hbatt{text-align:center}
body.narrow #wbody>div:first-child,body.narrow #hbatt .battbox{justify-content:center}

/* ---- Home ---- */
#clockface{width:100%;height:100%;max-height:100%;cursor:pointer}
.wx{cursor:pointer;min-height:120px}
.wx .big{font-size:44px;font-weight:700;line-height:1}
.wxmap{margin-top:10px}
.wxmap a{position:relative;display:block;width:100%;height:110px;border-radius:10px;
  overflow:hidden;background:#27242e;border:1px solid var(--line)}
.wxmap a img{position:absolute;width:257px;height:257px;max-width:none}
.wxmap a i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:#f85149;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.wxmap a b{position:absolute;right:3px;bottom:2px;font:9px sans-serif;color:#333;
  background:rgba(255,255,255,.75);padding:0 2px;border-radius:2px}
.wxmap .ll{text-align:center;margin-top:5px}
.battbox{display:flex;gap:14px;align-items:center}
.pct{font-size:36px;font-weight:700}

/* ---- Power flow and heater diagram ---- */
.dia{width:100%;height:100%}
.dia{font-size:15px} .dia text{fill:var(--txt);font-family:inherit}   /* size on the svg, so a label's own font-size wins */
.dia .m{fill:var(--muted)} .dia .b{font-weight:600;font-size:18px}
.trk{fill:none;stroke-width:3} .flowdots{fill:none;stroke-width:7;stroke-linecap:round;
  stroke-dasharray:0 14;animation:run linear infinite}
@keyframes run{to{stroke-dashoffset:-14}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.94,1.08)}60%{transform:scale(1.04,.93)}80%{transform:scale(.97,1.04)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-44px);opacity:0}}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.8}100%{transform:translate(4px,20px) scale(1.4);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.fan{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.6s linear infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite}
.pipe{stroke-width:6;fill:none;stroke-dasharray:6 6;animation:dash .3s linear infinite}
.bub{animation:rise 1.7s ease-in infinite}
.puff{animation:puff 1.4s ease-out infinite}
.elem{animation:glow 1.6s ease-in-out infinite}

/* ---- heater controls ---- */
.ctrls{display:grid;gap:7px;align-content:start}
.ctrls .row{display:grid;grid-template-columns:1fr 48px;gap:7px}

/* ---- Lights ---- */
#wheel{width:150px;height:150px;border-radius:50%;position:relative;cursor:crosshair;flex:0 0 auto;
  background:radial-gradient(circle,#fff 0,#fff0 70%),conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
#wheel.off{opacity:.45}
#wmark{position:absolute;width:16px;height:16px;border-radius:50%;border:3px solid var(--txt);
  box-shadow:0 0 0 2px #000;transform:translate(-50%,-50%)}
#panicbtn{width:112px;height:112px;border-radius:50%;background:#b8403b;color:var(--txt);
  font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;margin:10px auto;position:relative;touch-action:none}
#panicring{position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(var(--txt) var(--p,0%),#0000 0);-webkit-mask:radial-gradient(#0000 60px,#000 61px);
  mask:radial-gradient(#0000 60px,#000 61px)}

/* ---- Level ---- */
.lvl svg text{font-family:inherit}

/* ---- Switches ---- */
.swb{display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  background:var(--panel);border-radius:var(--r);padding:14px;min-height:108px;
  box-shadow:0 3px 0 #0006, inset 0 1px 0 var(--hi);border:1px solid transparent}
.swb .ic{width:28px;height:28px;color:var(--muted)}
.swb.on{background:#33291a;border-color:var(--brand)} .swb.on .ic{color:var(--brand)}
.swb b{font-size:18px;margin-top:10px} .swb .ft{display:flex;justify-content:space-between;align-items:center}

/* ---- Drive ---- */
.tick{display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer;font-size:17px}
.tick .box{width:24px;height:24px;border-radius:5px;border:2px solid var(--line);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.tick.on{color:var(--muted)} .tick.on .box{background:var(--green);border-color:var(--green)}
.check{display:flex;gap:12px;align-items:flex-start;padding:7px 0}

/* ---- the logo page: the whole screen, as on the display ---- */
#logopage{display:none;align-items:center;justify-content:center;background:var(--bg)}
#logopage.show{display:flex}
#badge{width:min(88%,88vh);height:auto;max-height:88%;border-radius:50%;pointer-events:none}
body.logo header,body.logo nav{display:none}

/* ---- pop-ups ---- */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
#modal .box{background:var(--panel);border-radius:16px;padding:18px;width:min(380px,92vw);text-align:center}
#modal h3{margin:4px 0 12px;font-size:21px} #modal p{margin:6px 0;color:var(--muted)}
#modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--panel2);
  padding:9px 16px;border-radius:12px;display:none;z-index:40;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="title">Home</div>
    <div id="hbar"></div>
    <div id="hright"><a id="nopw" href="/settings#security" style="display:none">Set a hub password</a>
      <span id="link" title="Hub"></span><span id="clock">--:--</span>
      <a id="gear" href="/settings" title="Settings"><svg class="ic" viewBox="0 0 18 18"><use href="#i-gear"/></svg></a></div>
  </header>
  <div id="pages">

  <!-- ================= Home ================= -->
  <section class="page" data-page="home">
    <div class="view show" data-view="main">
      <div class="grid home">
        <div class="card" style="padding:6px;display:flex;align-items:center;justify-content:center"
             onclick="subview('home','timer')"><svg id="clockface" viewBox="-110 -110 220 220"></svg></div>
        <div class="right">
          <div class="card wx" onclick="subview('home','forecast')">
            <div style="display:flex;justify-content:space-between"><span class="lab">Weather</span>
              <span class="muted small" id="wplace"></span></div>
            <div id="wbody"></div>
          </div>
          <div class="card" onclick="go('power');subview('power','battery')"><div id="hbatt"></div></div>
        </div>
      </div>
    </div>
    <div class="view" data-view="forecast"><div class="grid" style="grid-template-rows:auto 1fr">
      <div class="card"><div style="display:flex;justify-content:space-between"><span class="lab">Next 12 hours</span>
        <span class="small" style="color:var(--blue)">bars: chance of rain</span></div><svg id="fc12" viewBox="0 0 440 100" style="width:100%"></svg></div>
      <div class="grid" id="fcdays" style="grid-template-columns:repeat(3,1fr);height:auto"></div>
    </div></div>
    <div class="view" data-view="timer">
      <div id="ktview" style="text-align:center">
        <div id="kttime" class="num" style="font-size:min(22vw,110px);font-weight:700;margin-top:6px">05:00</div>
        <div class="muted" id="ktstate">Set the time</div>
        <div class="grid" style="grid-template-columns:repeat(4,1fr);height:auto;margin-top:14px">
          <button class="btn" data-kt="-60">&minus; 1 min</button><button class="btn" data-kt="60">+ 1 min</button>
          <button class="btn" data-kt="300">+ 5 min</button><button class="btn" data-kt="600">+ 10 min</button></div>
        <div class="grid" style="grid-template-columns:1fr 1fr;height:auto;margin-top:8px">
          <button class="btn" id="ktreset">Reset</button><button class="btn go" id="ktgo">Start</button></div>
      </div>
      <div id="acview" style="display:none;text-align:center">
        <div id="actime" class="num" style="font-size:min(22vw,110px);font-weight:700;color:var(--brand)">07:00</div>
        <div class="muted" id="acnote">&nbsp;</div>
        <div class="grid" style="grid-template-columns:repeat(4,1fr);height:auto;margin-top:14px">
          <button class="btn" data-ac="-60">&minus; 1 h</button><button class="btn" data-ac="60">+ 1 h</button>
          <button class="btn" data-ac="-5">&minus; 5 min</button><button class="btn" data-ac="5">+ 5 min</button></div>
        <div class="grid" style="grid-template-columns:repeat(3,1fr);height:auto;margin-top:8px">
          <button class="btn" id="acdays">Every day</button><button class="btn" id="acwarm">No warm-up</button>
          <button class="btn" id="acon">Alarm off</button></div>
      </div>
    </div>
  </section>

  <!-- ================= Power ================= -->
  <section class="page" data-page="power">
    <div class="view show" data-view="flow"><svg class="dia" id="flow" viewBox="0 36 480 242" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="view" data-view="details"><div class="grid two">
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
        <span class="lab">Battery</span><button class="chip" onclick="subview('power','day')">24 h</button></div>
        <div id="pdbatt"></div></div>
      <div class="grid" id="pdtiles" style="grid-template-rows:repeat(4,1fr)"></div>
    </div></div>
    <div class="view" data-view="day"><div class="grid" style="grid-template-rows:1fr auto">
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
        <span class="lab">Battery &middot; last 24 hours</span><button class="chip" onclick="subview('power','flow')">Now</button></div>
        <svg id="daychart" viewBox="0 0 440 150" style="width:100%;height:calc(100% - 30px)" preserveAspectRatio="none"></svg></div>
      <div class="card"><span class="lab">Energy today</span><div id="today" class="grid" style="grid-template-columns:repeat(4,1fr);height:auto;margin-top:6px"></div></div>
    </div></div>
    <div class="view" data-view="battery"><div class="grid two" id="battpage"></div></div>
    <div class="view" data-view="lights"><div class="grid side">
      <div class="card" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center">
        <div style="width:100%" class="lab">Ambient light</div>
        <div id="wheel"><div id="wmark"></div></div>
        <div style="display:grid;gap:8px;min-width:130px">
          <button class="btn" id="amon">Off</button><button class="btn" id="amcyc">Cycle</button>
          <button class="btn" id="amwarm">Warm</button>
          <div class="muted small" style="text-align:center">Brightness</div>
          <div class="step" style="justify-content:center"><button data-ab="-10"><svg class="ic" viewBox="0 0 18 18"><use href="#i-minus"/></svg></button>
            <b id="ambv">50%</b><button data-ab="10"><svg class="ic" viewBox="0 0 18 18"><use href="#i-plus"/></svg></button></div>
        </div>
      </div>
      <div class="card" style="text-align:center"><div class="lab" style="text-align:left">Security</div>
        <button id="panicbtn"><span id="panicring"></span><svg class="ic" viewBox="0 0 18 18" style="width:28px;height:28px"><use href="#i-siren"/></svg>Hold</button>
        <div class="muted small">Hold for the siren</div>
        <button class="btn" id="guardbtn" style="width:100%;margin-top:12px">Guard off</button>
        <div class="muted small" id="guardnote" style="margin-top:6px"></div>
        <button class="btn" id="ledbtn" style="width:100%;margin-top:12px">Status light on</button>
        <div class="muted small" style="margin-top:6px">The van display's gold light. Alarms still flash it.</div>
      </div>
    </div></div>
  </section>

  <!-- ================= Heater ================= -->
  <section class="page" data-page="heater">
    <div class="view show" data-view="main"><div class="grid side">
      <div>
        <svg class="dia" id="hdia" viewBox="0 36 292 242" preserveAspectRatio="xMidYMid meet"></svg>
        <svg class="dia" id="hdial" viewBox="0 36 292 242" preserveAspectRatio="xMidYMid meet" style="display:none"></svg>
      </div>
      <div class="ctrls">
        <button class="btn" data-heat="air"><svg class="ic" viewBox="0 0 18 18"><use href="#i-flame"/></svg>Air heat</button>
        <button class="btn" data-heat="combi"><svg class="ic" viewBox="0 0 18 18"><use href="#i-flame"/></svg>Air + water</button>
        <button class="btn" data-heat="water"><svg class="ic" viewBox="0 0 18 18"><use href="#i-drop"/></svg>Water heat</button>
        <button class="btn" data-heat="vent" title="The fan on its own: no flame, no heat"><svg class="ic" viewBox="0 0 18 18"><use href="#i-fan"/></svg>Fan only</button>
        <div class="row"><button class="btn" id="hwater"><svg class="ic" viewBox="0 0 18 18"><use href="#i-drop"/></svg><span>60&deg;C</span></button>

<script src="/common.js"></script>
<script>
"use strict";
// ============================================================================
// State
// ============================================================================
const $ = id => document.getElementById(id);
const PAGES = [["home","Home","home"],["power","Power","bolt"],["heater","Heater","flame"],
               ["level","Level","level"],["switches","Switches","switch"],["tanks","Tanks","drop"],
               ["drive","Drive","check"]];
let D = null;                 // the latest /api/data
let WX = null;                // the latest /api/weather
let LV = null;                // the latest /api/level
let hubOff = 0;               // hub clock minus this device's, s
let page = 0;
const LOGO = PAGES.length;    // the logo page: after the tabs' pages, reached by swiping
const sub = {home:"main", power:"flow", heater:"main", level:"main"};
let heaterView = "flow", levelView = "bubble", clockView = "timer";
let target = null, water = 2, busy = null, result = null, resultAt = 0;
let editing = 0;              // ms of the last local edit to a shared setting
const ic = (n, cls) => '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 18 18"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hubNow = () => Date.now() / 1000 + hubOff;
const hm = h => { if(h == null || h < 0) return "–"; if(h >= 99) return "99+ h";
  const m = Math.round(h * 60); return m < 60 ? m + " m" : Math.floor(m / 60) + " h " + (m % 60) + " m"; };
// the same, tight: "12h15m", "45m", "99h+"
const hmShort = h => { if(h == null || h < 0) return "–"; if(h >= 99) return "99h+";
  const m = Math.round(h * 60); return m < 60 ? m + "m" : Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m"; };
const num = (v, d) => v == null ? "–" : Number(v).toFixed(d || 0);
function toast(t){ const e = $("toast"); e.textContent = t; e.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 3500); }

async function post(url, body){
  // the hub's password, when one is set, is asked for and sent by common.js
  const r = await (await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
                                     body:JSON.stringify(body)})).json();
  if(r && r.auth) throw new Error("needs the hub's password");
  if(r && r.ok === false) throw new Error(r.error || "refused");
  return r;
}
async function share(part){           // the display's shared settings, as on the Van page
  editing = Date.now();
  try{ const r = await post("/api/display", part); if(D){ D.display = r.display; D.wake = r.wake; } render(); }
  catch(e){ toast("Not saved: " + e.message); }
}

// ============================================================================
// Navigation: tabs, header, sub-views, swipe
// ============================================================================
function buildTabs(){
  $("tabs").innerHTML = PAGES.map((p, i) => '<button data-i="' + i + '">' + ic(p[2]) + p[1] + '</button>').join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.i));
}
function go(i){
  if(typeof i === "string") i = PAGES.findIndex(p => p[0] === i);
  if(i === page && i !== LOGO){ const n = PAGES[i][0]; if(sub[n]) subview(n, n === "power" ? "flow" : "main"); return; }
  page = i; showPage(); render();
  try{ localStorage.setItem("page", i); }catch(e){}
}
let shownPage = -1;
function showPage(){
  // a page opens at its top: each keeps its own scroll, and coming back to one
  // left scrolled down hid its heading and the top of its first card
  document.querySelectorAll(".page").forEach((s, i) => { s.classList.toggle("show", i === page); s.style.transform = "";
    if(i === page && page !== shownPage) s.scrollTop = 0; });
  shownPage = page;
  document.body.classList.toggle("logo", page === LOGO);
  $("tabs").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === page));
}
function subview(pg, v){
  sub[pg] = v;
  document.querySelectorAll('.page[data-page="' + pg + '"] .view').forEach(e => e.classList.toggle("show", e.dataset.view === v));
  if(pg === "power" && v === "day") loadHistory();
  render();
}
function header(){
  if(page === LOGO) return;
  const name = PAGES[page][0]; let title = PAGES[page][1], bar = "";
  const chip = (label, icon, fn) => '<button class="chip" onclick="' + fn + '">' + ic(icon) + esc(label) + '</button>';
  if(name === "home"){
    const now = new Date();
    title = now.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});
    if(sub.home === "forecast"){ title = "Forecast" + (WX && WX.meta && WX.meta.place ? " · " + WX.meta.place : ""); bar = chip("Home", "back", "subview('home','main')"); }
    if(sub.home === "timer"){ title = clockView === "alarm" ? "Alarm clock" : "Kitchen timer";
      bar = chip(clockView === "alarm" ? "Timer" : "Alarm", clockView === "alarm" ? "clock" : "alarm", "clockView='" + (clockView === "alarm" ? "timer" : "alarm") + "';render()")
          + chip("Home", "back", "subview('home','main')"); }
  } else if(name === "power"){
    const cur = sub.power === "battery" ? "battery" : sub.power === "lights" ? "lights" : "flow";
    bar = '<div class="seg">' + [["Flow","flow"],["Battery","battery"],["Lights","lights"]].map(s =>
      '<button class="' + (s[1] === cur ? "on" : "") + '" onclick="subview(\'power\',\'' + s[1] + '\')">' + s[0] + '</button>').join("") + '</div>';
    if(sub.power === "details") bar += chip("24 h", "clock", "subview('power','day')");
  } else if(name === "heater"){
    if(sub.heater === "schedule"){ title = "Heater schedule"; bar = chip("Heater", "back", "subview('heater','main')"); }
    else bar = (heaterView === "flow" ? chip("Dial", "level", "heaterView='dial';render()") : chip("Diagram", "flame", "heaterView='flow';render()"))
             + chip("Timers", "clock", "subview('heater','schedule')");
  } else if(name === "level"){
    if(sub.level === "gforce"){ title = "G-force"; bar = chip("Level", "level", "subview('level','main')"); }
    else { const l = LV && LV.level; if(l && l.ok && l.off_by != null) title = "Level · " + num(l.off_by, 1) + "° out";
      bar = chip("G-force", "engine", "subview('level','gforce')"); }
  } else if(name === "tanks"){ if(tankLevels().demo) bar = '<span class="chip">' + ic("drop") + 'Sample levels</span>';
  } else if(name === "switches"){ if(!(D && D.relays)) bar = '<span class="chip">' + ic("switch") + 'Not wired yet</span>'; }
  else if(name === "drive"){ const left = driveLeft(); title = left ? "Not ready · " + left + " to check" : "Ready to drive"; }
  $("title").textContent = title;
  if($("hbar").innerHTML !== bar) $("hbar").innerHTML = bar;
}

// Drag between pages, as on the display: the page follows the finger and the
// next one comes in beside it; past a quarter of the way it carries on.
(function(){
  const box = $("pages"); let x0 = null, y0 = 0, dx = 0, drag = false, nb = null, t0 = 0;
  const sec = () => document.querySelectorAll(".page");
  box.addEventListener("pointerdown", e => {
    if(e.target.closest("#wheel,#panicbtn,#lvmain,#hdial,input,select")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; drag = false; t0 = Date.now();
  });
  box.addEventListener("pointermove", e => {
    if(x0 === null) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if(!drag){ if(Math.abs(mx) < 14 || Math.abs(mx) < Math.abs(my)) { if(Math.abs(my) > 14) x0 = null; return; }
      drag = true; try{ box.setPointerCapture(e.pointerId); }catch(er){} }
    dx = mx / Z;
    const n = sec().length, want = (page + (dx < 0 ? 1 : n - 1)) % n;
    if(nb !== want){ if(nb !== null) sec()[nb].classList.remove("show"); nb = want; sec()[nb].classList.add("show"); }
    const w = box.clientWidth;
    sec()[page].style.transition = sec()[nb].style.transition = "none";
    sec()[page].style.transform = "translateX(" + dx + "px)";
    sec()[nb].style.transform = "translateX(" + (dx + (dx < 0 ? w : -w)) + "px)";
  });
  const end = () => {
    if(x0 === null) return; x0 = null;
    if(!drag){ return; }
    const w = box.clientWidth, v = dx * Z / Math.max(1, Date.now() - t0);
    const goOn = Math.abs(dx) > w / 4 || Math.abs(v) > 0.6;
    const cur = sec()[page], nx = sec()[nb];
    [cur, nx].forEach(s => s.style.transition = "transform .22s ease-out");
    if(goOn){ cur.style.transform = "translateX(" + (dx < 0 ? -w : w) + "px)"; nx.style.transform = "translateX(0)"; }
    else { cur.style.transform = "translateX(0)"; nx.style.transform = "translateX(" + (dx < 0 ? w : -w) + "px)"; }
    const target = nb; nb = null; drag = false;
    setTimeout(() => {
      [cur, nx].forEach(s => { s.style.transition = ""; s.style.transform = ""; });
      if(goOn){ page = target; try{ localStorage.setItem("page", page); }catch(e){} }
      showPage(); render();
    }, 230);
  };
  box.addEventListener("pointerup", end); box.addEventListener("pointercancel", end);
})();

// ============================================================================
// Home: clock, weather, battery
// ============================================================================
function buildClock(){
  let s = '<circle r="104" fill="#121016" stroke="#34303c" stroke-width="2"/>';
  for(let i = 0; i < 60; i++){
    const a = i * Math.PI / 30, big = i % 5 === 0, r0 = big ? 88 : 94, r1 = 100;
    s += '<line x1="' + (Math.sin(a) * r0).toFixed(1) + '" y1="' + (-Math.cos(a) * r0).toFixed(1) + '" x2="' + (Math.sin(a) * r1).toFixed(1) +
         '" y2="' + (-Math.cos(a) * r1).toFixed(1) + '" stroke="' + (big ? "#efe9e0" : "#5a5361") + '" stroke-width="' + (big ? 3 : 1.4) + '" stroke-linecap="round"/>';
  }
  [["12",0,-66],["3",68,6],["6",0,76],["9",-68,6]].forEach(t => s += '<text x="' + t[1] + '" y="' + t[2] + '" text-anchor="middle" fill="#efe9e0" font-size="20" font-family="inherit">' + t[0] + '</text>');
  s += '<line id="hh" y1="10" y2="-52" stroke="#efe9e0" stroke-width="7" stroke-linecap="round"/>' +
       '<line id="mh" y1="14" y2="-80" stroke="#efe9e0" stroke-width="4.5" stroke-linecap="round"/>' +
       '<line id="sh" y1="18" y2="-88" stroke="#d3a94a" stroke-width="2" stroke-linecap="round"/>' +
       '<circle r="6" fill="#d3a94a"/><circle r="2.5" fill="#1c1a22"/>';
  $("clockface").innerHTML = s;
}
function tickClock(){
  const n = new Date(), s = n.getSeconds(), m = n.getMinutes() + s / 60, h = (n.getHours() % 12) + m / 60;
  $("hh").setAttribute("transform", "rotate(" + h * 30 + ")");
  $("mh").setAttribute("transform", "rotate(" + m * 6 + ")");
  $("sh").setAttribute("transform", "rotate(" + s * 6 + ")");
  $("clock").textContent = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
}
const WMO = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Freezing fog",51:"Drizzle",53:"Drizzle",
  55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",
  67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",
  85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunder and hail",99:"Thunder and hail"};
function wxIcon(code, size, night){
  // the display's weather pictures, drawn in SVG
  const c = code == null ? 3 : code, sun = c <= 2, cloud = c >= 1, rain = (c >= 51 && c <= 67) || (c >= 80 && c <= 82),
        snow = (c >= 71 && c <= 77) || c === 85 || c === 86, storm = c >= 95;
  let s = '<svg viewBox="0 0 60 60" width="' + size + '" height="' + size + '">';
  if(sun) s += night ? '<path d="M34 12a14 14 0 1 0 12 20 11 11 0 0 1-12-20z" fill="#b8b0c4"/>'

// ---- G-force, for driving (as display/ui.py): an accelerometer cannot tell a
// tilt from an acceleration, so the apparent tilt is turned back into the force
// felt - forward g = tan(pitch), sideways g = tan(roll), from the levelling
// calibration - and bumps from how far the total strays from a steady 1 g.
const G_SCALE = 0.6;
const GF = {now: null, trail: [], base: null, peak: {acc:0, brk:0, left:0, right:0, bump:0}};
function gSample(l){
  if(!l || !l.ok) return;
  const rad = Math.PI / 180, lat = Math.tan((l.roll || 0) * rad), lon = Math.tan((l.pitch || 0) * rad);
  const a = l.axes || {}, mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
  let vert = 0;
  if(mag){ GF.base = GF.base == null ? mag : GF.base + 0.02 * (mag - GF.base); vert = mag - GF.base; }
  GF.now = [lat, lon, vert]; GF.trail = GF.trail.concat([[lat, lon]]).slice(-24);
  const p = GF.peak; p.acc = Math.max(p.acc, lon); p.brk = Math.max(p.brk, -lon);
  p.right = Math.max(p.right, lat); p.left = Math.max(p.left, -lat); p.bump = Math.max(p.bump, Math.abs(vert));

}

$("lvcal").onclick = async () => {
  if(!confirm("Set the current position as level?\n\nThe van should be on ground you know to be flat and have stopped moving.")) return;
  const b = $("lvcal"); b.disabled = true; b.textContent = "Measuring…";
  try{
    await post("/api/level", {action: "calibrate"});
    toast("Level set");
    LV = null;                               // the next reading is against the new zero
  }catch(e){ toast("Not set: " + e.message); }
  b.disabled = false; b.textContent = "Set level here";
};

// ============================================================================
// Switches (for relays on the hub later) and Drive
// ============================================================================
const SWITCHES = [["Water pump","drop"],["Fridge","snow"],["Garage light","home"],["Inverter","bolt"],["Lights","bulb"],["USB","power"]];
function renderSwitches(){
  // the state is the hub's, shared with the display - as the ambient light is
  const swState = (D && D.display && Array.isArray(D.display.switches)) ? D.display.switches : [false,false,false,false,false,false];
  // names as set in the hub's settings
  const nm = (D && Array.isArray(D.switch_names) && D.switch_names.length === SWITCHES.length) ? D.switch_names : SWITCHES.map(s => s[0]);
  const icn = (D && Array.isArray(D.switch_icons) && D.switch_icons.length === SWITCHES.length) ? D.switch_icons : SWITCHES.map(s => s[1]);
  $("swgrid").innerHTML = SWITCHES.map((s, i) => '<button class="swb' + (swState[i] ? " on" : "") + '" data-sw="' + i + '">' + ic(icn[i] || s[1]) + '<b>' + esc(nm[i] || s[0]) + '</b>' +
    '<div class="ft"><span class="small" style="color:' + (swState[i] ? "var(--brand)" : "var(--muted)") + '">' + (swState[i] ? "On" : "Off") + '</span><span class="tog' + (swState[i] ? " on" : "") + '"></span></div></button>').join("");
  // the relays: behind the hub's password, like the heater
  $("swgrid").querySelectorAll("[data-sw]").forEach(b => b.onclick = async () => { const i = +b.dataset.sw;
    editing = Date.now();
    try{ const r = await post("/api/switches", {i: i, on: !swState[i]}); if(D){ D.display = r.display; } render(); }
    catch(e){ toast("Not switched: " + e.message); } });
}
function driveChecks(){
  const d = D || {}, out = [], h = d.heater || {};
  out.push(d.mains_live ? ["Hook-up", "bad", "Still plugged in!"] : ["Hook-up", "ok", "Unplugged"]);
  out.push(h.on ? ["Heater on", "warn", "Heater is on"] : (h.connected || h.remembered) ? ["Heater off", "ok", "Off"] : ["Heater off", "warn", "Not read - check it"]);
  const al = (d.alerts || []).filter(a => !a.acked);
  out.push(al.length ? ["Alarms", "bad", al[0].title] : ["No alarms", "ok", "None"]);
  const soc = d.connected ? d.soc : null;
  out.push(soc == null ? ["Battery", "warn", "Offline"] : soc < 20 ? ["Battery", "warn", soc + "% - low"] : ["Battery", "ok", soc + "%"]);
  return out;
}
function driveLeft(){ const items = (D && D.checklist) || [], ticks = new Set(((D && D.display) || {}).ticks || []);
  return driveChecks().filter(c => c[1] !== "ok").length + items.filter(i => !ticks.has(i)).length; }
function renderDrive(){
  const col = {ok:"var(--green)", warn:"var(--amber)", bad:"var(--red)"};
  $("dchecks").innerHTML = driveChecks().map(c => '<div class="check"><span class="dot" style="background:' + col[c[1]] + ';margin-top:6px"></span><div><div style="font-weight:600;font-size:18px">' +
    esc(c[0]) + '</div><div class="small" style="color:' + (c[1] === "ok" ? "var(--muted)" : col[c[1]]) + '">' + esc(c[2]) + '</div></div></div>').join("");
  const items = (D && D.checklist) || [], ticks = new Set(((D && D.display) || {}).ticks || []);
  $("dticks").innerHTML = items.map((t, i) => '<div class="tick' + (ticks.has(t) ? " on" : "") + '" data-i="' + i + '"><span class="box">' + (ticks.has(t) ? ic("check").replace("ic", "ic") : "") + '</span><span>' + esc(t) + '</span></div>').join("");
  $("dticks").querySelectorAll("[data-i]").forEach(el => el.onclick = () => { const t = items[+el.dataset.i], s = new Set(D.display.ticks || []);
    s.has(t) ? s.delete(t) : s.add(t); D.display.ticks = [...s]; renderDrive(); header(); share({ticks: D.display.ticks}); });
}

// ============================================================================
// Rendering and polling
// ============================================================================
function render(){
  if(page === LOGO) return;
  header();
  const name = PAGES[page][0];
  if(name === "home"){ if(sub.home === "forecast") renderForecast(); else if(sub.home === "timer") renderTimer(); else renderHome(); }
  else if(name === "power"){ const v = sub.power; if(v === "flow") renderFlow(); else if(v === "details") renderDetails(); else if(v === "day") renderDay();
    else if(v === "battery") renderBattery(); else if(v === "lights") renderLights(); }
  else if(name === "heater"){ if(sub.heater === "schedule") renderSchedule(); else renderHeater(); }
  else if(name === "level"){ if(sub.level === "gforce") renderGforce(); else renderLevel(); }
  else if(name === "switches") renderSwitches();
  else if(name === "tanks") renderTanks();
  else if(name === "drive") renderDrive();
}
async function poll(){
  try{
    const d = await (await fetch("/api/data", {cache:"no-store"})).json();
    if(d.updated) hubOff = d.updated - Date.now() / 1000;
    const oldAt = D && D.heater && D.heater.at;
    if(Date.now() - editing < 2500 && D && D.display) d.display = D.display;     // an edit here is newer
    D = d;
    if(d.heater && d.heater.at !== oldAt) adoptHeater(d.heater);
    $("nopw").style.display = d.auth_set === false ? "" : "none";
    $("link").className = "ok";
    render();
  }catch(e){ $("link").className = "down"; }
}
async function pollWeather(){ try{ WX = await (await fetch("/api/weather", {cache:"no-store"})).json(); render(); }catch(e){} }
async function pollLevel(){
  if(page !== LOGO && PAGES[page][0] === "level" && !document.hidden){
    try{ LV = await (await fetch("/api/level", {cache:"no-store"})).json();
      if(sub.level === "gforce"){ gSample(LV.level); renderGforce(); } else renderLevel(); header(); }catch(e){}
  }
  setTimeout(pollLevel, sub.level === "gforce" ? 300 : (LV && LV.refresh_ms) || 800);
}
// ---- fitting the screen ------------------------------------------------------
// Held sideways (or on a laptop or tablet) the app is the display's layout,
// drawn at a size designed for and scaled as one piece to fill the screen -
// so a phone on its side shows the whole display, not a cropped strip of it.
// Held upright on a phone, the cards stack instead and nothing is scaled.
const DESIGN_W = 900, DESIGN_H = 560;
let Z = 1;                                   // the scale; touches are divided by it
function fit(){
  // the safety banner, when it shows, takes its own height (which includes
  // the notch on a phone) from the top
  const bar = document.body.classList.contains("alerting") && $("alertbar");
  const bh = bar ? bar.offsetHeight || 52 : 0;
  document.documentElement.style.setProperty("--alerth", bh + "px");
  const w = innerWidth, h = innerHeight - bh;
  const narrow = h > w && w < 700;
  document.body.classList.toggle("narrow", narrow);
  Z = narrow ? 1 : Math.max(0.4, Math.min(w / DESIGN_W, h / DESIGN_H, 1.6));
  const app = $("app");
  app.style.width = (w / Z) + "px"; app.style.height = (h / Z) + "px";
  app.style.transform = Z === 1 ? "" : "scale(" + Z + ")";
}
fit();
// the alarm bar, when it shows, takes room from the top: fit round it
new MutationObserver(fit).observe(document.body, {attributes: true, attributeFilter: ["class"]});
addEventListener("orientationchange", () => setTimeout(() => { fit(); buildFlow(); render(); }, 200));
buildTabs(); buildClock(); buildFlow();
addEventListener("resize", () => { fit(); const was = flowMode; buildFlow(); if(flowMode !== was) render(); });
try{ const p = +localStorage.getItem("page"); if(p >= 0 && p < PAGES.length) page = p; }catch(e){}
showPage(); tickClock(); setInterval(tickClock, 1000);
setInterval(() => { if(page !== LOGO && PAGES[page][0] === "home" && sub.home === "timer") renderTimer(); }, 1000);
  poll(); setInterval(poll, 5000);
  pollWeather(); setInterval(pollWeather, 600000);
pollLevel();
</script>
